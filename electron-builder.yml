appId: com.yueye.reader
productName: 阅野
executableName: YueyeReader
asar: true
npmRebuild: false
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - electron/**/*.cjs
  - build/icon.png
  - package.json
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: YueyeReader-Setup-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 阅野
  uninstallDisplayName: 阅野 EPUB 阅读器
  deleteAppDataOnUninstall: false
  installerLanguages: [zh_CN, en_US]
  language: '2052'
